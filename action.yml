name: git-trenes
description: Un tren en pixel art que crece, cambia de color y acelera según tu actividad en GitHub.
author: Cracksmity
branding:
  icon: navigation
  color: orange

inputs:
  github-token:
    description: Token para leer tu actividad. Para contribuciones privadas usa un PAT.
    default: ${{ github.token }}
  usuario:
    description: Usuario de GitHub a dibujar. Por defecto, el dueño del repositorio.
    default: ${{ github.repository_owner }}
  tren:
    description: "auto (evoluciona con tus vagones), un modelo (tranvia, metro-naranja, metro-gris, metro-amarillo, metro-blanco, bala) o la ruta a tu propio tren en JSON (por ejemplo .github/tren.json)."
    default: auto
  fondo:
    description: "Ciudad del fondo: ciudad (aleatoria), nueva-york o la ruta a tu propio skyline en JSON (por ejemplo .github/fondo.json)."
    default: ciudad
  modo:
    description: "single (un tren con tu lenguaje principal) o multi (3 vías, un tren por lenguaje)."
    default: single
  tema:
    description: "both (genera claro, oscuro y automático), light, dark o auto."
    default: both
  idioma:
    description: "Idioma de los textos: es o en. Cambia la palabra del letrero (RACHA / STREAK) y las tarjetas."
    default: es
  etiqueta:
    description: Palabra del letrero LED antes del número de racha. Si se omite depende de idioma.
    default: ""
  escala:
    description: Tamaño de cada píxel en el SVG (1 a 6).
    default: "2"
  salida:
    description: Carpeta donde se escriben los SVG.
    default: dist
  tarjetas:
    description: "Tarjetas de perfil a generar: none, stats (estadísticas), langs (lenguajes) o both."
    default: none
  rango:
    description: "Centro del anillo de la tarjeta de estadísticas: letra (S, A+, B...) o github (la marca)."
    default: letra
  borde:
    description: "Borde de las tarjetas: true o false."
    default: "true"
  lenguajes-max:
    description: Máximo de lenguajes en la tarjeta de lenguajes (1 a 10).
    default: "6"
  color-fondo:
    description: Color de fondo de las tarjetas, hexadecimal sin #.
    default: ""
  color-titulo:
    description: Color del título de las tarjetas, hexadecimal sin #.
    default: ""
  color-icono:
    description: Color de los iconos de las tarjetas, hexadecimal sin #.
    default: ""
  color-texto:
    description: Color del texto de las tarjetas, hexadecimal sin #.
    default: ""
  color-anillo:
    description: Color del anillo de rango de las tarjetas, hexadecimal sin #.
    default: ""

outputs:
  archivos:
    description: Rutas de los SVG generados, separadas por coma.
  vagones:
    description: Número de vagones del tren principal.
  racha:
    description: Racha actual en días.
  estado:
    description: idle, slow, normal o fast, según la actividad de ayer.
  modelo:
    description: Modelo de tren principal.

runs:
  using: node24
  main: src/index.js
