<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>git-trenes · playground</title>
<style>
  :root {
    --bg: #f4f1ea; --panel: #ffffff; --ink: #1f2430; --muted: #646b7a; --line: #dcd7cb; --accent: #c2410c;
    --chk: #e6e1d4;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14161d; --panel: #1c1f29; --ink: #e8eaf0; --muted: #9097a8; --line: #2d3140; --accent: #fb923c; --chk: #232734; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 2px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 28px 0 10px; font-weight: 600; }
  p.sub { margin: 0; color: var(--muted); }
  .layout { display: grid; grid-template-columns: 280px 1fr; gap: 20px; margin-top: 18px; align-items: start; }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
  label:first-child { margin-top: 0; }
  select, input[type=range], input[type=color] { width: 100%; }
  select { padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; }
  input[type=color] { height: 30px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
  .row { display: flex; justify-content: space-between; align-items: baseline; }
  .row output { font-variant-numeric: tabular-nums; color: var(--ink); font-size: 13px; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg button { flex: 1; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; cursor: pointer; }
  .seg button[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .stage { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .stage img { display: block; width: 100%; height: auto; image-rendering: pixelated; border-radius: 6px; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 8px; display: flex; gap: 14px; flex-wrap: wrap; }
  .zoomwrap { background: repeating-conic-gradient(var(--chk) 0 25%, transparent 0 50%) 0 0 / 16px 16px; border: 1px solid var(--line); border-radius: 10px; padding: 14px; overflow-x: auto; }
  canvas { image-rendering: pixelated; display: block; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; overflow-x: auto; }
  .card h3 { margin: 0 0 6px; font-size: 14px; }
  .card.pick { outline: 2px solid var(--accent); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>git-trenes · playground</h1>
  <p class="sub">Lo que ves abajo es el SVG real que generaría la Action, incrustado con &lt;img&gt; como en un README.</p>

  <div class="layout">
    <aside class="panel">
      <label>Modo</label>
      <div class="seg" id="modo">
        <button data-v="single" aria-pressed="true">Un tren</button>
        <button data-v="multi" aria-pressed="false">3 vías</button>
      </div>

      <label for="tren">Modelo</label>
      <select id="tren"></select>

      <label for="lang">Lenguaje principal (color de la franja)</label>
      <select id="lang"></select>

      <label><span class="row"><span>Contribuciones del año</span><output id="o-total"></output></span></label>
      <input type="range" id="total" min="0" max="2600" step="10" value="1400">

      <label><span class="row"><span>Racha (días)</span><output id="o-streak"></output></span></label>
      <input type="range" id="streak" min="0" max="60" value="12">

      <label><span class="row"><span>Contribuciones de ayer</span><output id="o-yesterday"></output></span></label>
      <input type="range" id="yesterday" min="0" max="20" value="6">

      <label>Tema</label>
      <div class="seg" id="tema">
        <button data-v="light" aria-pressed="true">Claro</button>
        <button data-v="dark" aria-pressed="false">Oscuro</button>
      </div>
    </aside>

    <section>
      <div class="stage"><img id="scene" alt="Escena del tren"></div>
      <div class="meta" id="meta"></div>
    </section>
  </div>

  <h2>Pixel art ampliado (modelo y vagones actuales)</h2>
  <div class="seg" id="puertas" style="max-width:340px;margin-bottom:8px">
    <button data-v="closed" aria-pressed="true">Puertas cerradas</button>
    <button data-v="open" aria-pressed="false">Puertas abiertas</button>
  </div>
  <div class="zoomwrap"><canvas id="zoom"></canvas></div>

  <h2>Catálogo (3 vagones, franja con el color del lenguaje)</h2>
  <div class="gallery" id="gallery"></div>
</main>

<script type="module">
import { buildTrain } from '../src/train.js';
import { renderScene, STATES } from '../src/scene.js';
import { MODELS, MODEL_ORDER } from '../src/models.js';
import { LANGUAGE_COLORS } from '../src/languages.js';
import { summarize, stateFor, carsFor, CAR_THRESHOLDS } from '../src/stats.js';
import { buildSpec } from '../src/compose.js';
import { sampleDays, SAMPLE_LANGUAGES } from '../src/sample.js';

const $ = (id) => document.getElementById(id);
const state = { modo: 'single', tema: 'light', puertas: 'closed' };

// --- selects
$('tren').innerHTML = '<option value="auto">Auto (evoluciona con los vagones)</option>' +
  MODEL_ORDER.map((id) => `<option value="${id}">${MODELS[id].name}</option>`).join('');
const langNames = Object.keys(LANGUAGE_COLORS);
$('lang').innerHTML = langNames.map((n) => `<option>${n}</option>`).join('');
$('lang').value = 'TypeScript';

function seg(id, key, cb) {
  $(id).addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    state[key] = b.dataset.v;
    for (const x of $(id).children) x.setAttribute('aria-pressed', String(x === b));
    cb();
  });
}

function statsFromControls() {
  const total = +$('total').value, streak = +$('streak').value, yesterday = +$('yesterday').value;
  const days = sampleDays({ total: Math.max(total, 1), streak, yesterday });
  const lang = $('lang').value;
  const langs = [{ name: lang, color: LANGUAGE_COLORS[lang], bytes: 640000 },
    ...SAMPLE_LANGUAGES.filter((l) => l.name !== lang).slice(0, 3)];
  const s = summarize({ user: 'octocat', days, languages: langs });
  s.total = total; s.yesterday = yesterday; s.streak = streak;
  s.cars = carsFor(total); s.state = stateFor(yesterday);
  return s;
}

let url;
function render() {
  $('o-total').textContent = $('total').value;
  $('o-streak').textContent = $('streak').value;
  $('o-yesterday').textContent = $('yesterday').value;
  const s = statsFromControls();
  const spec = buildSpec(s, { tren: $('tren').value, modo: state.modo, theme: state.tema, scale: 2 });
  const svg = renderScene(spec);
  if (url) URL.revokeObjectURL(url);
  url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
  $('scene').src = url;
  const t = spec.tracks[0];
  $('meta').innerHTML = `<span>${s.cars} vagón(es)</span><span>estado: <b>${s.state}</b></span><span>racha ${s.streak}</span><span>SVG ${(svg.length / 1024).toFixed(1)} KB</span>`;
  zoom(t);
  document.querySelectorAll('.card').forEach((c) => c.classList.toggle('pick', c.dataset.id === t.model));
}

// --- canvas
function paint(canvas, train, scale, openDoors) {
  canvas.width = train.width * scale; canvas.height = train.height * scale;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const order = ['body', 'lit', 'wa'].concat(openDoors ? ['open'] : [], ['led']);
  for (const name of order) {
    const g = train.layers[name];
    for (let y = 0; y < g.h; y++) for (let x = 0; x < g.w; x++) {
      const c = g.cells[y * g.w + x];
      if (!c || c[0] === '@') continue;
      ctx.fillStyle = c; ctx.fillRect(x * scale, y * scale, scale, scale);
    }
  }
}

function zoom(t) {
  const train = buildTrain(MODELS[t.model], { cars: t.cars, stripe: t.stripe, streak: t.streak, label: 'RACHA', dir: t.dir });
  paint($('zoom'), train, 5, state.puertas === 'open');
}

function gallery() {
  const s = statsFromControls();
  $('gallery').innerHTML = '';
  for (const id of MODEL_ORDER) {
    const card = document.createElement('div'); card.className = 'card'; card.dataset.id = id;
    card.innerHTML = `<h3>${MODELS[id].name}</h3>`;
    const c = document.createElement('canvas'); card.append(c); $('gallery').append(card);
    paint(c, buildTrain(MODELS[id], { cars: 3, stripe: s.languages[0].color, streak: s.streak, label: 'RACHA' }), 3, false);
  }
}

for (const id of ['total', 'streak', 'yesterday']) $(id).addEventListener('input', () => { render(); });
$('tren').addEventListener('change', render);
$('lang').addEventListener('change', () => { render(); gallery(); });
seg('modo', 'modo', render);
seg('tema', 'tema', render);
seg('puertas', 'puertas', render);
gallery(); render();
</script>
</body>
</html>
